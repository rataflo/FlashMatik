; Banc test generaliste : UN SEUL firmware, plusieurs tests lancés au serial.
; Pas de flash par test : chaque test est un module, le runner fait le dispatch.
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_port = COM14
; Partager le constants.h du firmware principal = meme source de pins.
build_flags = -I../../src
lib_deps =
	teemuatlut/TMCStepper@^0.7.3
	waspinator/AccelStepper@^1.64
