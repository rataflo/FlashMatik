; Programme de test : mesure du nombre de pas entre deux bras du spider
; (7 bras / 14 tanks) via les lamelles + opto, pour recalculer la rotation.
; Board identique au firmware principal, uniquement l'axe ROT est pilote.

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_port = COM14
build_src_filter = +<*>
lib_deps =
	AccelStepper@^1.64
	teemuatlut/TMCStepper@^0.7.3
