[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps = 
	neu-rah/ArduinoMenu library@^4.21.5
	fmalpartida/LiquidCrystal@^1.5.0
	soligen2010/ClickEncoder@0.0.0-alpha+sha.9337a0c46c
	thijse/EEPROMEx@0.0.0-alpha+sha.09d7586108
	paulstoffregen/TimerThree@^1.1
	waspinator/AccelStepper@^1.64
	arduino-libraries/Servo@^1.2.2
	mmarchetti/DirectIO@^1.2.0
	wayoda/LedControl@^1.0.6
	pololu/FastGPIO@^2.2.0
	watterott/digitalWriteFast@^1.0.0
	majicdesigns/MD_MAX72XX@^3.5.1
	teemuatlut/TMCStepper@^0.7.3
	adafruit/Adafruit NeoPixel@^1.15.5
